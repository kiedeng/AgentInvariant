name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit & E2E tests
        run: pytest -q

      - name: Demo pipeline (record -> compare -> gate)
        run: |
          agentinvariant record --config examples/finance_sql_agent/agentinvariant.yaml
          # 示例内置一个已知回归(finance-003),门禁必须以退出码 1 阻止发布
          set +e
          agentinvariant compare --config examples/finance_sql_agent/agentinvariant.yaml
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected gate to FAIL with exit code 1, got $code"
            exit 1
          fi

      - name: Upload reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: behavior-diff-reports
          path: examples/finance_sql_agent/.agentinvariant/
          if-no-files-found: error
          # 产物目录以点开头,upload-artifact v4 默认排除隐藏文件
          include-hidden-files: true
