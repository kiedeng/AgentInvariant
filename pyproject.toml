[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentinvariant"
version = "0.2.0"
description = "Execution virtualization and release assurance engine for production AI agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "pyyaml>=6",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentinvariant = "agentinvariant.cli:main"

[tool.setuptools.packages.find]
where = ["packages/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
